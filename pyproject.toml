[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-cli"
version = "0.1.0"
description = "Terminal chat client for ChatGPT and Claude web apps (webai-provider) with a Textual TUI"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "webai-provider>=1.3.0b0",
    "textual>=1.0",
    "python-bidi>=0.6.0",
    "pyperclip>=1.8.0",
]

[project.scripts]
ai-cli = "ai_cli.app:run"

[tool.setuptools.packages.find]
where = ["src"]
